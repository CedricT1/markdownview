<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer & Exporter</title>
    <!-- Chemins relatifs pour fonctionner même si l'app est servie dans un sous-dossier -->
    <link rel="icon" type="image/svg+xml" href="static/markdown-viewer-icon.svg">
    <link rel="stylesheet" href="static/css/style.css">
    <!-- Les thèmes seront chargés dynamiquement ou via une classe sur body -->
</head>
<body> <!-- La classe 'theme-dark' ou 'theme-light' sera ajoutée ici -->

    <header>
        <h1>Markdown Viewer & Exporter</h1>
        <button id="theme-toggle">Changer de Thème</button>
    </header>

    <main class="container">
        <section class="editor-section">
            <h2>Votre Markdown</h2>
            <textarea id="markdown-input" rows="20" placeholder="Collez votre Markdown ici..."></textarea>
        </section>

        <section class="preview-section">
            <h2>Aperçu</h2>
            <div id="markdown-preview" class="markdown-body">
                <!-- L'aperçu HTML sera injecté ici -->
            </div>
        </section>
    </main>

    <footer class="container">
        <h2>Exporter</h2>
        <form id="export-form" method="POST">
            <input type="hidden" name="markdown" id="export-markdown-content">
            <button type="submit" formaction="export/html">Exporter en HTML</button>
            <button type="submit" formaction="export/pdf">Exporter en PDF</button>
            <button type="submit" formaction="export/odt">Exporter en ODT</button>
        </form>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });</script>
    <script src="static/js/main.js"></script>
</body>
</html>
