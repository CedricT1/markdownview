services:
  markdownview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markdownview_app_container
    ports:
      - "5050:5000" # Port hôte 5050 -> port conteneur 5000
    restart: unless-stopped
    depends_on:
      - kroki
    environment:
      PYTHONUNBUFFERED: 1
      # URL interne du service Kroki (rendu Mermaid -> image pour PDF/ODT)
      KROKI_URL: http://kroki:8000

  # Kroki : rend les diagrammes en image côté serveur (utilisé pour PDF/ODT).
  kroki:
    image: yuzutech/kroki
    container_name: markdownview_kroki
    restart: unless-stopped
    depends_on:
      - kroki-mermaid
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
    expose:
      - "8000"

  # Companion requis par Kroki pour le type Mermaid (rendu via navigateur headless).
  kroki-mermaid:
    image: yuzutech/kroki-mermaid
    container_name: markdownview_kroki_mermaid
    restart: unless-stopped
    expose:
      - "8002"
